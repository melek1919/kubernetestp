name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy_k8s:
    name: Deploy to Kubernetes
    needs: [build_image]
    runs-on: ubuntu-latest
    environment:
      name: production
    
    # Équivalent du "when: manual" de GitLab : le déploiement attend une validation manuelle ou se lance sur demande
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Environment Variables
        run: |
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_ENV
          echo "APP_VERSION=${{ github.sha }}" >> $GITHUB_ENV

      - name: Set up kubectl and gettext (for envsubst)
        run: |
          sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Authenticate to Kubernetes Cluster
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply Manifests and Secrets
        run: |
          
          kubectl apply -f k8s/namespace.yaml

         
          kubectl create secret docker-registry gitlab-registry \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            -n demo --dry-run=client -o yaml | kubectl apply -f -

          
          envsubst '${IMAGE} ${APP_VERSION}' < k8s/deployment.yaml | kubectl apply -f -

          
          kubectl apply -f k8s/service.yaml

          
          kubectl rollout status deployment/web -n demo --timeout=120s
